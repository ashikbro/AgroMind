version: '3.8'

# IMPORTANT: Before running docker-compose up, set the JWT_SECRET environment variable:
# export JWT_SECRET="your-super-secure-random-secret-minimum-32-characters"
# Or create a .env file in the same directory with: JWT_SECRET=your-secret-here

services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: agromind-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: agromind
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - agromind-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agromind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agromind-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agromind-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/agromind?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - agromind-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agromind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agromind-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  agromind-network:
    driver: bridge
